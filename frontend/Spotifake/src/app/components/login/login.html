<div class="login-container">
  <h1>🎧 Spotifake</h1>
  <p>Bitte melde dich an, um Musik zu hören.</p>
  
  <input [(ngModel)]="username" placeholder="Dein Name" />
  <input [(ngModel)]="password" type="password" placeholder="Passwort" />
  
  <button (click)="doLogin()">Jetzt Einloggen</button>
</div>
