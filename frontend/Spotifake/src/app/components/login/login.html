<div class="auth-wrapper">
  <div class="auth-header">
    <div class="logo">Spotifake</div>
  </div>

  <div class="auth-content">
    <h1>{{ isLoginMode ? 'Melde dich an' : 'Registrieren' }}</h1>
    
    <div *ngIf="successMessage" class="success-box">
      {{ successMessage }}
    </div>

    <div *ngIf="error" class="error-box">
      {{ error }}
    </div>

    <form (submit)="handleSubmit(); $event.preventDefault()">
      <div class="form-group">
        <label>Benutzername</label>
        <input type="text" [(ngModel)]="username" name="username" placeholder="Benutzername" required>
      </div>

      <div class="form-group">
        <label>Passwort</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Passwort" required>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ isLoginMode ? 'Anmelden' : 'Registrieren' }}
      </button>
    </form>

    <div class="divider"></div>

    <div class="toggle-section">
      <p>{{ isLoginMode ? 'Hast du kein Konto?' : 'Hast du bereits ein Konto?' }}</p>
      <button (click)="toggleMode()" class="btn-outline">
        {{ isLoginMode ? 'KONTO ERSTELLEN' : 'ZUM LOGIN' }}
      </button>
    </div>
  </div>
</div>
