@if (music.currentSong()) {
  <div class="player-leiste">
    <div>
      Gerade läuft: <b>{{ music.currentSong().title }}</b>
    </div>
    
    <button (click)="music.togglePlay()">
      {{ music.isPlaying() ? '⏸ Pause' : '▶ Abspielen' }}
    </button>

    <div style="color: #1db954;">
      {{ music.isPlaying() ? 'Musik läuft...' : 'Angehalten' }}
    </div>
  </div>
}
