<section class="song-list">
  <h2>Deine Mediathek</h2>
  <div class="song-grid">
    @for (song of music.songs(); track song._id) {
      <div class="song-karte" [class.aktiv]="music.currentSong()?._id === song._id">
        <h3>{{ song.title }}</h3>
        <p>von {{ song.artist }}</p>
        <button (click)="music.play(song)">▶ Abspielen</button>
      </div>
    } @empty {
      <p>Noch keine Musik da. Lade etwas über Swagger hoch!</p>
    }
  </div>
</section>
