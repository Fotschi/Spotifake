<div class="main-layout" [class.no-shell]="auth.isLoggedIn() === false || router.url === '/' || router.url === '/auth'">
  
  <!-- Sidebar (Nur wenn eingeloggt und nicht auf der Entry-Seite) -->
  <aside *ngIf="auth.isLoggedIn() && router.url !== '/' && router.url !== '/auth'" class="sidebar">
    <div class="logo">
      <span class="icon">🎧</span> Spotifake
    </div>
    
    <nav>
      <a routerLink="/songs" routerLinkActive="active" class="nav-item">
        <svg role="img" height="24" width="24" class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 0 1 3 0l7.5 4.33a2 2 0 0 1 1 1.732V21a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-6h-3v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.577a2 2 0 0 1 1-1.732l7.5-4.33z"></path></svg>
        Home
      </a>
      <a routerLink="/admin" routerLinkActive="active" class="nav-item">
        <svg role="img" height="24" width="24" class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.91,7.62,6.29L5.23,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.72,8.87 c-0.11,0.2-0.06,0.47,0.12,0.61l2.03,1.58C4.84,11.36,4.81,11.68,4.81,12c0,0.32,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.11-0.2,0.06-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
        Admin
      </a>
    </nav>

    <div class="playlists-section">
      <div class="playlists-header">
        <span class="playlists-title">PLAYLISTS</span>
        <button class="btn-create-playlist" (click)="fileInput.click()" title="Playlist erstellen">
          <svg role="img" height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M15.25 8a.75.75 0 0 1-.75.75H8.75v5.75a.75.75 0 0 1-1.5 0V8.75H1.5a.75.75 0 0 1 0-1.5h5.75V1.5a.75.75 0 0 1 1.5 0v5.75h5.75a.75.75 0 0 1 .75.75z"></path></svg>
        </button>
        <input type="file" #fileInput style="display: none" (change)="onFileSelected($event)" accept="image/*">
      </div>
      
      <div class="playlists-list">
        <a *ngFor="let playlist of playlistService.playlists()"
           (click)="navigateToPlaylist(playlist._id)"
           href="#"
           [class.active]="router.isActive('/playlist/' + playlist._id, true)"
           class="playlist-item">
          <img *ngIf="playlist.imagePath" [src]="'/' + playlist.imagePath" class="playlist-mini-img" alt="">
          <span *ngIf="!playlist.imagePath" class="playlist-mini-icon">📁</span>
          {{ playlist.name }}
        </a>
      </div>
    </div>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <span class="username">{{ auth.currentUser()?.username }}</span>
        <button (click)="auth.logout()" class="btn-logout">Logout</button>
      </div>
    </div>
  </aside>

  <!-- Content Area -->
  <main class="content">
    <!-- WebSocket Benachrichtigung -->
    <div *ngIf="socketService.lastEvent()" class="notification">
      {{ socketService.lastEvent() }}
    </div>

    <router-outlet></router-outlet>
  </main>

  <!-- Player (Nur wenn eingeloggt und nicht auf der Entry-Seite) -->
  <app-player *ngIf="auth.isLoggedIn()"></app-player>
</div>
