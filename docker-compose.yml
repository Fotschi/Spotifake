services:
  mongodb:
    image: mongo:latest
    container_name: spotifake-db
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  spotifake-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotifake-app
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/spotifake
      - JWT_SECRET=spotifake_geheimnis_123
      - PORT=3000
    depends_on:
      - mongodb
    volumes:
      - ./backend/spotifake/uploads:/app/backend/uploads

volumes:
  mongodb_data:
